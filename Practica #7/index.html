<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practica 7 - Tarjeta de presentacion</title>
    <link rel="stylesheet" href="estilos.css">
</head>

<body>

    <h1>Practica 7 - Tarjeta de presentacion</h1>

    <section class="tarjeta" id="tarjeta">
        <h2 id="nombre">Sebastian Cascante</h2>
        <p id="descripcion">Estudiante de Diseño y Progra Web.</p>

        <ul>
            <li>Ciudad: <span id="ciudad">San Jose, Costa Rica</span></li>
            <li>Visitas: <span id="visitas">0</span></li>
            <li>Estado: <span id="estado">disponible</span></li>
        </ul>
    </section>

    <div class="botones">
        <button id="btnVisita">Sumar visita</button>
        <button id="btnEstado">Cambiar disponibilidad</button>
    </div>

    <p id="mensaje">Presione un boton para ver los cambios.</p>

    <script src="dom.js"></script>
</body>

</html>
